<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutina Rodolfo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <!-- Cabecera -->
        <header class="header" id="header">
            <h1>Rutina Rodolfo</h1>
            <button class="btn-empezar" onclick="scrollToDays()">Ir a la rutina</button>
        </header>

        <!-- Seleccionador de Día -->
        <section class="day-selector-container" id="selector">
            <h2>Elegir Día</h2>
            <div class="days-grid">
                <button class="btn-dia" onclick="loadDay('lunes', this)">Lunes</button>
                <button class="btn-dia" onclick="loadDay('martes', this)">Martes</button>
                <button class="btn-dia" onclick="loadDay('miercoles', this)">Miércoles</button>
                <button class="btn-dia" onclick="loadDay('jueves', this)">Jueves</button>
                <button class="btn-dia" onclick="loadDay('viernes', this)">Viernes</button>
            </div>
        </section>

        <!-- Información General del Día -->
        <section class="day-info" id="dayInfo">
            <h2 id="dayName">LUNES</h2>
            <p class="focus-text">Día de: <span id="dayFocus">Pecho, hombros y tríceps</span></p>
            <p class="warmup-text">Calentamiento: <span id="dayWarmup">10-15 min caminadora</span></p>
        </section>

        <!-- Contenedor de Ejercicios -->
        <main class="exercises-container" id="exercisesContainer">
            <!-- Los ejercicios se inyectarán aquí vía JavaScript -->
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
